<!DOCTYPE html>
<html>
<head>
<title>Snake Pro Custom</title>
<style>
body {
  text-align:center;
  background:#0f172a;
  color:white;
  font-family:sans-serif;
}

.menu { margin:10px; }

button, select {
  padding:8px;
  margin:5px;
  border-radius:8px;
  border:none;
}

canvas {
  display:block;
  margin:auto;
  background:#020617;
  border:2px solid #38bdf8;
  border-radius:10px;
}

/* kontrol HP */
.controls button {
  width:60px;
  height:60px;
  font-size:20px;
  margin:5px;
}
</style>
</head>
<body>

<div class="menu">
<h2>🐍 Snake Pro Custom</h2>

<label>Jumlah Player:</label>
<select id="playerCount">
<option value="1">1 Player</option>
<option value="2">2 Player</option>
<option value="3" selected>3 Player</option>
</select>
<br>

<label>Difficulty:</label>
<select id="difficulty">
<option value="140">Easy</option>
<option value="100" selected>Medium</option>
<option value="70">Hard</option>
</select>
<br>

<label>Skin P1:</label>
<select id="skin1">
<option value="#22c55e">Green</option>
<option value="#f97316">Orange</option>
<option value="#e11d48">Red</option>
</select>

<label>Skin P2:</label>
<select id="skin2">
<option value="#06b6d4">Blue</option>
<option value="#a855f7">Purple</option>
<option value="#facc15">Yellow</option>
</select>

<label>Skin P3:</label>
<select id="skin3">
<option value="#facc15">Yellow</option>
<option value="#14b8a6">Teal</option>
<option value="#ef4444">Red</option>
</select>

<br>
<button onclick="startGame()">Start</button>

<p>High Score: <span id="highScore">0</span></p>
<p>P1: Arrow | P2: WASD | P3: IJKL</p>
</div>

<canvas id="game" width="600" height="600"></canvas>

<!-- tombol HP -->
<div class="controls">
  <br>
  <button onclick="setDir(0,-20)">⬆</button><br>
  <button onclick="setDir(-20,0)">⬅</button>
  <button onclick="setDir(20,0)">➡</button><br>
  <button onclick="setDir(0,20)">⬇</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const GRID = 20;
const SIZE = 600;

let touchStartX = 0;
let touchStartY = 0;

let game = {
  running:false,
  speed:100,
  interval:null,
  highScore: localStorage.getItem("snakeHigh") || 0
};

document.getElementById("highScore").innerText = game.highScore;

// SOUND
function beep(freq){
  let a=new (window.AudioContext||window.webkitAudioContext)();
  let o=a.createOscillator();
  o.frequency.value=freq;
  o.connect(a.destination);
  o.start();
  setTimeout(()=>o.stop(),100);
}

// GRID
function drawGrid(){
  ctx.strokeStyle = "rgba(255,255,255,0.05)";
  for(let i=0;i<SIZE;i+=GRID){
    ctx.beginPath();
    ctx.moveTo(i,0);
    ctx.lineTo(i,SIZE);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0,i);
    ctx.lineTo(SIZE,i);
    ctx.stroke();
  }
}

// PLAYER
function createPlayer(x,y,color){
  return {
    snake:[{x,y}],
    dx:GRID,
    dy:0,
    color,
    score:0,
    alive:true
  };
}

let players=[];
let food;

// START
function startGame(){
  let count = parseInt(document.getElementById("playerCount").value);

  let skins = [
    document.getElementById("skin1").value,
    document.getElementById("skin2").value,
    document.getElementById("skin3").value
  ];

  players=[];

  if(count>=1) players.push(createPlayer(100,100,skins[0]));
  if(count>=2) players.push(createPlayer(500,100,skins[1]));
  if(count>=3) players.push(createPlayer(300,500,skins[2]));

  food=randomFood();

  game.speed=parseInt(document.getElementById("difficulty").value);
  game.running=true;

  clearInterval(game.interval);
  game.interval=setInterval(gameLoop,game.speed);
}

// FOOD
function randomFood(){
  return {
    x: Math.floor(Math.random()*(SIZE/GRID))*GRID,
    y: Math.floor(Math.random()*(SIZE/GRID))*GRID
  };
}

// MOVE
function movePlayer(p){
  if(!p.alive) return;

  let head={
    x:p.snake[0].x+p.dx,
    y:p.snake[0].y+p.dy
  };

  if(head.x<0||head.y<0||head.x>=SIZE||head.y>=SIZE){
    p.alive=false;
    beep(100);
    return;
  }

  for(let part of p.snake){
    if(head.x===part.x && head.y===part.y){
      p.alive=false;
      beep(100);
      return;
    }
  }

  p.snake.unshift(head);

  if(head.x===food.x && head.y===food.y){
    p.score++;
    beep(500);
    food=randomFood();
  } else {
    p.snake.pop();
  }
}

// COLLISION
function checkCollision(){
  players.forEach(p=>{
    if(!p.alive) return;

    let head=p.snake[0];

    players.forEach(o=>{
      if(p===o) return;

      for(let part of o.snake){
        if(head.x===part.x && head.y===part.y){
          p.alive=false;
          beep(100);
        }
      }
    });
  });
}

// DRAW
function draw(){
  ctx.fillStyle="#020617";
  ctx.fillRect(0,0,SIZE,SIZE);
  drawGrid();

  let pulse = Math.sin(Date.now()*0.005)*2;

  ctx.fillStyle="#ef4444";
  ctx.beginPath();
  ctx.arc(food.x+10, food.y+10, 8 + pulse, 0, Math.PI*2);
  ctx.fill();

  players.forEach(p=>{
    if(!p.alive) return;

    ctx.shadowBlur = 10;
    ctx.shadowColor = p.color;

    p.snake.forEach((part,i)=>{
      ctx.fillStyle = i===0 ? p.color : "#4ade80";
      ctx.beginPath();
      ctx.roundRect(part.x,part.y,GRID,GRID,6);
      ctx.fill();
    });

    ctx.shadowBlur = 0;
  });

  ctx.fillStyle="white";
  ctx.font="16px Arial";
  players.forEach((p,i)=>{
    ctx.fillText("P"+(i+1)+": "+p.score,10,20+i*20);
  });
}

// LOOP
function gameLoop(){
  if(!game.running) return;

  players.forEach(movePlayer);
  checkCollision();

  let alive = players.filter(p=>p.alive);

  if(players.length === 1){
    if(!players[0].alive){
      endGame(null);
      return;
    }
  } else {
    if(alive.length <= 1){
      endGame(alive[0]);
      return;
    }
  }

  draw();
}

// END
function endGame(winner){
  game.running=false;
  clearInterval(game.interval);

  let best=Math.max(...players.map(p=>p.score));
  if(best>game.highScore){
    localStorage.setItem("snakeHigh",best);
  }

  setTimeout(()=>{
    alert(winner ? "Pemenang!" : "Game Over!");
    location.reload();
  },100);
}

// KEYBOARD
document.addEventListener("keydown",e=>{
  let [p1,p2,p3]=players;

  if(p1){
    if(e.key==="ArrowUp"&&p1.dy===0){p1.dx=0;p1.dy=-GRID;}
    if(e.key==="ArrowDown"&&p1.dy===0){p1.dx=0;p1.dy=GRID;}
    if(e.key==="ArrowLeft"&&p1.dx===0){p1.dx=-GRID;p1.dy=0;}
    if(e.key==="ArrowRight"&&p1.dx===0){p1.dx=GRID;p1.dy=0;}
  }

  if(p2){
    if(e.key==="w"&&p2.dy===0){p2.dx=0;p2.dy=-GRID;}
    if(e.key==="s"&&p2.dy===0){p2.dx=0;p2.dy=GRID;}
    if(e.key==="a"&&p2.dx===0){p2.dx=-GRID;p2.dy=0;}
    if(e.key==="d"&&p2.dx===0){p2.dx=GRID;p2.dy=0;}
  }

  if(p3){
    if(e.key==="i"&&p3.dy===0){p3.dx=0;p3.dy=-GRID;}
    if(e.key==="k"&&p3.dy===0){p3.dx=0;p3.dy=GRID;}
    if(e.key==="j"&&p3.dx===0){p3.dx=-GRID;p3.dy=0;}
    if(e.key==="l"&&p3.dx===0){p3.dx=GRID;p3.dy=0;}
  }
});

// BUTTON HP
function setDir(x,y){
  let p = players[0];
  if(!p) return;

  if((x!==0 && p.dx===0) || (y!==0 && p.dy===0)){
    p.dx = x;
    p.dy = y;
  }
}

// SWIPE
canvas.addEventListener("touchstart", e=>{
  let touch = e.touches[0];
  touchStartX = touch.clientX;
  touchStartY = touch.clientY;
});

canvas.addEventListener("touchend", e=>{
  let touch = e.changedTouches[0];
  let dx = touch.clientX - touchStartX;
  let dy = touch.clientY - touchStartY;

  let p = players[0];
  if(!p) return;

  if(Math.abs(dx) > Math.abs(dy)){
    if(dx > 0 && p.dx === 0){
      p.dx = GRID; p.dy = 0;
    } else if(dx < 0 && p.dx === 0){
      p.dx = -GRID; p.dy = 0;
    }
  } else {
    if(dy > 0 && p.dy === 0){
      p.dx = 0; p.dy = GRID;
    } else if(dy < 0 && p.dy === 0){
      p.dx = 0; p.dy = -GRID;
    }
  }
});
</script>

</body>
</html>
