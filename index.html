<!DOCTYPE html>
<html>
<head>
<title>Snake Pro 3 Player</title>
<style>
body {
  text-align:center;
  background:#0f172a;
  color:white;
  font-family:sans-serif;
}

.menu { margin:10px; }

button, select {
  padding:8px;
  margin:5px;
  border-radius:8px;
  border:none;
}

canvas {
  display:block;
  margin:auto;
  background:#020617;
  border:2px solid #38bdf8;
  border-radius:10px;
}

.controls button {
  width:60px;
  height:60px;
  font-size:20px;
}
</style>
</head>
<body>

<div class="menu">
<h2>🐍 Snake Pro 3 Player</h2>

<select id="difficulty">
<option value="140">Easy</option>
<option value="100" selected>Medium</option>
<option value="70">Hard</option>
</select>

<button onclick="startGame()">Start</button>

<p>High Score: <span id="highScore">0</span></p>
<p>P1: Arrow | P2: WASD | P3: IJKL</p>
</div>

<canvas id="game" width="600" height="600"></canvas>

<div class="controls">
<br>
<button onclick="setDir(0,-20)">⬆</button><br>
<button onclick="setDir(-20,0)">⬅</button>
<button onclick="setDir(20,0)">➡</button><br>
<button onclick="setDir(0,20)">⬇</button>
</div>

<script>
// ===== SETUP =====
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const GRID = 20;
const SIZE = 600;

let game = {
  running: false,
  speed: 100,
  interval: null,
  highScore: localStorage.getItem("snakeHigh") || 0
};

document.getElementById("highScore").innerText = game.highScore;

// ===== SOUND =====
function beep(freq){
  let a = new (window.AudioContext || window.webkitAudioContext)();
  let o = a.createOscillator();
  o.frequency.value = freq;
  o.connect(a.destination);
  o.start();
  setTimeout(()=>o.stop(),100);
}

// ===== PLAYER =====
function createPlayer(x,y,color){
  return {
    snake:[{x,y}],
    dx:GRID,
    dy:0,
    color,
    score:0,
    alive:true
  };
}

let players = [];
let food;

// ===== START =====
function startGame(){
  players = [
    createPlayer(100,100,"#22c55e"), // P1
    createPlayer(500,100,"#06b6d4"), // P2
    createPlayer(300,500,"#facc15")  // P3
  ];

  food = randomFood();

  game.speed = parseInt(document.getElementById("difficulty").value);
  game.running = true;

  clearInterval(game.interval);
  game.interval = setInterval(gameLoop, game.speed);
}

// ===== FOOD =====
function randomFood(){
  return {
    x: Math.floor(Math.random()*(SIZE/GRID))*GRID,
    y: Math.floor(Math.random()*(SIZE/GRID))*GRID
  };
}

// ===== MOVE =====
function movePlayer(p){
  if(!p.alive) return;

  let head = {
    x: p.snake[0].x + p.dx,
    y: p.snake[0].y + p.dy
  };

  // tembok
  if(head.x<0||head.y<0||head.x>=SIZE||head.y>=SIZE){
    p.alive = false;
    beep(100);
    return;
  }

  // diri sendiri
  for(let part of p.snake){
    if(head.x===part.x && head.y===part.y){
      p.alive = false;
      beep(100);
      return;
    }
  }

  p.snake.unshift(head);

  // makan
  if(head.x===food.x && head.y===food.y){
    p.score++;
    beep(500);
    food = randomFood();
  } else {
    p.snake.pop();
  }
}

// ===== COLLISION =====
function checkCollision(){
  players.forEach(p=>{
    if(!p.alive) return;

    let head = p.snake[0];

    players.forEach(other=>{
      if(p===other) return;

      for(let part of other.snake){
        if(head.x===part.x && head.y===part.y){
          p.alive = false;
          beep(100);
        }
      }
    });
  });
}

// ===== DRAW =====
function draw(){
  ctx.clearRect(0,0,SIZE,SIZE);

  // food
  ctx.fillStyle="red";
  ctx.fillRect(food.x,food.y,GRID,GRID);

  players.forEach(p=>{
    if(!p.alive) return;

    p.snake.forEach((part,i)=>{
      ctx.fillStyle = i===0 ? p.color : "#4ade80";
      ctx.fillRect(part.x,part.y,GRID,GRID);
    });
  });

  // score
  ctx.fillStyle="white";
  players.forEach((p,i)=>{
    ctx.fillText("P"+(i+1)+": "+p.score,10,20+i*20);
  });
}

// ===== LOOP =====
function gameLoop(){
  if(!game.running) return;

  players.forEach(movePlayer);
  checkCollision();

  let alive = players.filter(p=>p.alive);

  if(alive.length <= 1){
    endGame(alive[0]);
    return;
  }

  draw();
}

// ===== END =====
function endGame(winner){
  game.running = false;
  clearInterval(game.interval);

  let best = Math.max(...players.map(p=>p.score));
  if(best > game.highScore){
    localStorage.setItem("snakeHigh", best);
  }

  setTimeout(()=>{
    alert(winner ? "Pemenang!" : "Semua kalah!");
    location.reload();
  },100);
}

// ===== INPUT =====
document.addEventListener("keydown", e=>{
  let [p1,p2,p3] = players;

  if(p1){
    if(e.key==="ArrowUp"&&p1.dy===0){p1.dx=0;p1.dy=-GRID;}
    if(e.key==="ArrowDown"&&p1.dy===0){p1.dx=0;p1.dy=GRID;}
    if(e.key==="ArrowLeft"&&p1.dx===0){p1.dx=-GRID;p1.dy=0;}
    if(e.key==="ArrowRight"&&p1.dx===0){p1.dx=GRID;p1.dy=0;}
  }

  if(p2){
    if(e.key==="w"&&p2.dy===0){p2.dx=0;p2.dy=-GRID;}
    if(e.key==="s"&&p2.dy===0){p2.dx=0;p2.dy=GRID;}
    if(e.key==="a"&&p2.dx===0){p2.dx=-GRID;p2.dy=0;}
    if(e.key==="d"&&p2.dx===0){p2.dx=GRID;p2.dy=0;}
  }

  if(p3){
    if(e.key==="i"&&p3.dy===0){p3.dx=0;p3.dy=-GRID;}
    if(e.key==="k"&&p3.dy===0){p3.dx=0;p3.dy=GRID;}
    if(e.key==="j"&&p3.dx===0){p3.dx=-GRID;p3.dy=0;}
    if(e.key==="l"&&p3.dx===0){p3.dx=GRID;p3.dy=0;}
  }
});

// HP hanya P1
function setDir(x,y){
  let p1 = players[0];
  if(!p1) return;

  if((x!==0 && p1.dx===0) || (y!==0 && p1.dy===0)){
    p1.dx=x;
    p1.dy=y;
  }
}
</script>

</body>
</html>
